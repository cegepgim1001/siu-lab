<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber-Soho Funding Module</title>
<meta name="description" content="Password-protected funding request and budget for the Cyber-Soho mini-rack lab">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --surface-2:#F3EEE5; --line:#E3DCCF; --ink:#1B2B2A; --ink-2:#4A5552; --muted:#6B7471;
  --teal:#0E7C7B; --teal-soft:#E3F1EF; --rust:#B5440C; --rust-soft:#FBE9DF; --gold:#E8A317;
  --navh:64px; --radius:16px; --shadow:0 1px 2px rgba(27,43,42,.06),0 8px 24px rgba(27,43,42,.06);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.65}
a{color:var(--teal)}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}

/* ---------- top menu: always visible ---------- */
.topnav{position:fixed;inset:0 0 auto 0;height:var(--navh);z-index:50;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topnav-inner{max-width:1320px;margin:0 auto;height:100%;display:flex;align-items:center;gap:14px;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:#fff}
.brand b{font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-size:11.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.nav-mods{display:flex;gap:4px;margin-left:12px}
.nav-mod{display:flex;flex-direction:column;line-height:1.15;text-decoration:none;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:10px}
.nav-mod span{font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink)}
.nav-mod:hover,.nav-mod.active{background:var(--teal-soft)}
.nav-mod.active span{color:var(--teal)}
.nav-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip:hover{border-color:var(--teal);color:var(--teal)}
.progress-pill{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.progress-pill b{color:var(--teal)}
.menu-btn{display:none}
.navbar-progress{position:absolute;left:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--teal),var(--gold));width:0;transition:width .15s linear}

/* ---------- hero ---------- */
main{padding-top:var(--navh)}
.hero{max-width:1320px;margin:0 auto;padding:56px 16px 28px;display:grid;grid-template-columns:1.25fr .75fr;gap:32px;align-items:end}
.eyebrow{font-family:var(--mono);color:var(--teal);font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 14px}
.hero h1{font-size:clamp(32px,5vw,56px);line-height:1.05;letter-spacing:-.025em;margin:0 0 16px;font-weight:800}
.hero h1 em{font-style:normal;color:var(--rust)}
.hero p.lead{font-size:19px;color:var(--ink-2);max-width:640px;margin:0 0 24px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:640px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--teal)}
.stat span{font-size:13px;color:var(--muted)}

/* rehearsal timer */
.timer{background:var(--ink);color:#F4EFE6;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.timer h2{font-family:var(--mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:#9FD3CF;margin:0 0 6px;font-weight:700}
.clock{font-family:var(--mono);font-size:56px;font-weight:700;letter-spacing:-.02em;line-height:1}
.now{min-height:48px;margin:10px 0 14px;font-size:15px;color:#D9D2C5}
.now b{color:#fff;display:block;font-size:17px}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#2F403E;margin-bottom:14px;position:relative}
.bar i{display:block;height:100%;border-right:2px solid var(--ink)}
.bar i:nth-child(odd){background:#3D5653}.bar i:nth-child(even){background:#4A6865}
.bar .head{position:absolute;top:-3px;width:4px;height:16px;background:var(--gold);border-radius:2px;left:0;transition:left .25s linear}
.timer-btns{display:flex;gap:8px;flex-wrap:wrap}
.timer-btns button{border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px}
.t-start{background:var(--gold);color:var(--ink)}
.t-reset{background:#2F403E;color:#F4EFE6}
.t-go{background:transparent;color:#9FD3CF;text-decoration:underline;padding-left:4px!important}

/* ---------- layout ---------- */
.layout{max-width:1320px;margin:0 auto;padding:12px 16px 64px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:36px}
.side{position:sticky;top:calc(var(--navh) + 20px);align-self:start;max-height:calc(100vh - var(--navh) - 40px);overflow:auto;padding-right:4px}
.side-mod{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 10px 6px}
.side-mod:first-child{margin-top:0}
.side a{display:grid;grid-template-columns:30px 1fr 18px;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-size:14.5px;line-height:1.3}
.side a:hover{background:var(--surface-2)}
.side a.current{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--teal),var(--shadow)}
.side-num{font-family:var(--mono);font-size:12px;color:var(--muted)}
.side-done{color:var(--teal);font-weight:800;opacity:0}
.side a.is-done .side-done{opacity:1}
.side-tools{display:flex;gap:6px;margin-top:18px;padding:0 6px;flex-wrap:wrap}

/* ---------- modules & lessons ---------- */
.content{min-width:0}
.module{margin-bottom:56px}
.module-head{margin:8px 0 22px}
.module-kicker{font-family:var(--mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust)}
.module-head h2{font-size:clamp(26px,3.4vw,38px);letter-spacing:-.02em;line-height:1.15;margin:4px 0 10px}
.module-intro p{margin:0;color:var(--ink-2);font-size:17.5px;max-width:760px}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:0 0 18px;box-shadow:var(--shadow);scroll-margin-top:calc(var(--navh) + 12px)}
.lesson-head{position:sticky;top:var(--navh);z-index:20;display:flex;align-items:center;gap:14px;padding:14px 16px 14px 18px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:var(--radius) var(--radius) 0 0;border-bottom:1px solid var(--line)}
.lesson.folded .lesson-head{border-bottom-color:transparent;border-radius:var(--radius)}
.lesson.stuck .lesson-head{box-shadow:0 6px 16px -10px rgba(27,43,42,.35)}
.lesson-num{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--teal);background:var(--teal-soft);border-radius:10px;width:42px;height:42px;display:grid;place-items:center;flex:none}
.lesson.is-done .lesson-num{background:var(--teal);color:#fff}
.lesson-titles{min-width:0;flex:1}
.lesson-kicker{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.lesson-head h3{margin:0;font-size:19px;line-height:1.25;letter-spacing:-.01em}
.done-btn{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.done-btn .tick{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);font-size:11px;color:transparent}
.done-btn[aria-pressed="true"]{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}
.done-btn[aria-pressed="true"] .tick{background:var(--teal);border-color:var(--teal);color:#fff}
.fold-btn{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;background:var(--ink);color:#fff;border-radius:999px;padding:9px 14px 9px 16px;font-weight:700;font-size:14px;box-shadow:0 4px 14px -4px rgba(27,43,42,.5)}
.fold-btn:hover{background:var(--teal)}
.fold-btn svg{transition:transform .2s}
.lesson.folded .fold-btn{background:var(--teal)}
.lesson.folded .fold-btn svg{transform:rotate(180deg)}
.lesson-body{padding:20px 24px 26px}
.lesson-body[hidden]{display:none}
.lesson-body>p{margin:0 0 14px}
.lesson-body ul,.lesson-body ol{padding-left:22px;margin:0 0 14px}
.lesson-body li{margin:0 0 6px}
.lesson-body li p{margin:0}

/* content components */
.checklist{list-style:none;padding:0!important}
.checklist li{margin:0 0 8px}
.checklist label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg)}
.checklist input{width:20px;height:20px;margin-top:3px;accent-color:var(--teal);flex:none}
.checklist input:checked+span{color:var(--muted);text-decoration:line-through}
.check-meta{font-family:var(--mono);font-size:13px;color:var(--muted);margin:2px 0 0}
.beat{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:22px 0 8px;padding:10px 14px;border-radius:12px;background:var(--surface-2);border-left:4px solid var(--teal);scroll-margin-top:calc(var(--navh) + 90px);transition:background .2s,border-color .2s}
.beat-time{font-family:var(--mono);font-weight:700;color:var(--teal);font-size:14px}
.beat-name{font-weight:700}
.cue{color:var(--ink-2);font-size:15px;width:100%}
.beat.live{background:var(--rust-soft);border-left-color:var(--rust)}
.beat.live .beat-time{color:var(--rust)}
blockquote.line{margin:0 0 14px;padding:4px 0 4px 18px;border-left:2px dashed var(--line);font-size:17.5px;color:var(--ink)}
blockquote.line p{margin:0}
blockquote.line em{color:var(--muted)}
.note{background:#FFF7E3;border:1px solid #F1D79A;border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:15.5px}
.note strong{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8A5A00}
.shot{margin:22px 0 10px}
.zoom{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2);cursor:zoom-in}
.zoom img{width:100%;height:auto;transition:transform .3s}
.zoom:hover img{transform:scale(1.01)}
.shot figcaption{font-size:14px;color:var(--muted);margin-top:8px;text-align:center;font-style:italic}
.say{display:flex;gap:12px;align-items:flex-start;background:var(--rust-soft);border-radius:12px;padding:12px 16px;margin:0 0 26px}
.say-tag{flex:none;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--rust);padding:3px 8px;border-radius:6px;margin-top:3px}
.say p{margin:0;font-size:16.5px}
.table-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
th{background:var(--teal);color:#fff;text-align:left;font-weight:700;padding:10px 12px;font-size:14px}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even) td{background:#FBF9F5}
td p,th p{margin:0}
.copy{border:1px solid var(--teal);color:var(--teal);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;margin-left:6px}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(20,28,27,.88);display:none;align-items:center;justify-content:center;padding:24px;flex-direction:column;gap:12px}
.lightbox.open{display:flex}
.lightbox img{max-width:min(1400px,100%);max-height:84vh;border-radius:10px;background:#fff}
.lightbox p{color:#E8E2D8;margin:0;text-align:center;font-size:15px;max-width:900px}
.lightbox button{position:absolute;top:14px;right:16px;border:0;background:#fff;color:var(--ink);border-radius:999px;width:42px;height:42px;font-size:22px;font-weight:700}

/* drawer (mobile lesson list) */
.drawer-backdrop{display:none}

/* footer (Cyber.SoHo, text verbatim) */
.site-footer{background:var(--surface);border-top:1px solid var(--line);color:var(--ink-2);padding:24px 16px;margin-top:8px}
.site-footer p{display:flex;justify-content:center;align-items:center;gap:10px;margin:0;font-size:14px;text-align:center}
.site-footer img{height:48px;width:48px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:120}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1080px){
  .hero{grid-template-columns:1fr}
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:var(--navh);left:0;bottom:0;width:min(320px,86vw);max-height:none;background:var(--surface);z-index:60;padding:18px 12px;border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow)}
  body.drawer-open .side{transform:none}
  body.drawer-open .drawer-backdrop{display:block;position:fixed;inset:var(--navh) 0 0 0;background:rgba(27,43,42,.3);z-index:55}
  .menu-btn{display:inline-flex}
  .nav-mods{display:none}
}
@media (max-width:640px){
  :root{--navh:58px}
  .brand small,.progress-pill,.nav-tools .chip.hide-sm{display:none}
  .brand b{font-size:15px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .hero{padding-top:32px}
  .lesson-head{gap:10px;padding:10px 10px 10px 12px}
  .lesson-num{width:34px;height:34px;font-size:13px}
  .lesson-kicker{display:none}
  .lesson-head h3{font-size:16px}
  .done-btn .done-label,.fold-btn .fold-label{display:none}
  .done-btn{padding:8px}
  .fold-btn{padding:9px 11px}
  .lesson-body{padding:16px 14px 20px}
  .clock{font-size:44px}
  .site-footer p{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
@media print{.topnav,.side,.timer,.fold-btn,.done-btn{display:none!important}main{padding:0}.lesson-body[hidden]{display:block!important}.layout{display:block}.lesson-head{position:static}}
/* ---------- password gate ---------- */
body.locked{overflow:hidden}
.gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;background:
  radial-gradient(1200px 600px at 10% -10%,#E3F1EF 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#FBE9DF 0,transparent 55%),var(--bg);overflow:auto}
body:not(.locked) .gate{display:none}
.gate-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px 28px 22px;box-shadow:0 30px 60px -30px rgba(27,43,42,.35);text-align:center}
.gate-logo{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto 14px;border:1px solid var(--line)}
.gate-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin:0 0 6px}
.gate h1{font-size:26px;letter-spacing:-.02em;margin:0 0 8px;line-height:1.15}
.gate-sub{color:var(--ink-2);font-size:15px;margin:0 0 20px}
.gate-label{display:block;text-align:left;font-weight:600;font-size:14px;margin:0 0 6px}
.gate-field{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.gate-field:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.gate-field input{flex:1;min-width:0;border:0;background:transparent;padding:13px 14px;font:inherit;font-family:var(--mono);font-size:15px;color:var(--ink);outline:none}
.gate-eye{border:0;background:transparent;color:var(--teal);font-weight:700;font-size:13px;padding:0 14px}
.gate-go{width:100%;margin-top:14px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;padding:13px}
.gate-go:hover{background:var(--teal)}
.gate-go[disabled]{opacity:.6;cursor:progress}
.gate-msg{min-height:22px;margin:10px 0 0;font-size:14px;color:var(--rust);font-weight:600}
.gate-card.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.gate-foot{font-size:12px;color:var(--muted);margin:16px 0 0;border-top:1px solid var(--line);padding-top:14px}

/* ---------- budget widgets ---------- */
.timer.ask .clock{font-size:clamp(34px,4vw,46px)}
.ask-list{list-style:none;margin:0;padding:0;border-top:1px solid #2F403E}
.ask-list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #2F403E;font-size:15px;color:#D9D2C5}
.ask-list b{font-family:var(--mono);color:#fff}
h4.sub{font-size:17px;color:var(--rust);margin:26px 0 10px;letter-spacing:-.005em}
.lesson-body>h4.sub:first-child{margin-top:4px}
td.num{text-align:right;font-family:var(--mono);font-size:14px;white-space:nowrap}
tr.total td{background:var(--surface-2)!important;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 18px}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.tile b{display:block;font-size:22px;letter-spacing:-.02em;color:var(--ink)}
.tile span{font-size:13px;color:var(--muted)}
.viz{margin:6px 0 20px;padding:16px 16px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.viz-title{font-weight:700;font-size:15px;margin:0 0 12px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(150px,240px) 1fr 96px;align-items:center;gap:12px;padding:4px 6px;border-radius:8px;cursor:default}
.bar-row:hover,.bar-row:focus{background:var(--teal-soft);outline:none}
.bar-name{font-size:14px;line-height:1.25;color:var(--ink-2)}
.bar-name small{display:block;color:var(--muted);font-size:12px}
.bar-track{height:14px;border-radius:0 4px 4px 0;background:var(--surface-2)}
.bar-fill{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--teal);min-width:3px;transform-origin:left;animation:grow .7s ease-out both}
.bar-row:hover .bar-fill,.bar-row:focus .bar-fill{background:#0A5F5E}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar-val{font-family:var(--mono);font-size:13.5px;text-align:right;color:var(--ink)}
.viz-note{font-size:13px;color:var(--muted);margin:10px 0 0}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:7px 10px;border-radius:8px;max-width:300px;opacity:0;transition:opacity .12s;box-shadow:var(--shadow)}
.tip.on{opacity:1}
.calc{border:1px solid var(--line);border-radius:14px;padding:16px;margin:4px 0 20px;background:linear-gradient(180deg,#FFFFFF,#FBF9F5)}
.calc-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.calc-k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.calc-total{text-align:right}
.calc-total span{display:block;font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.02em}
.calc-total small{color:var(--muted);font-size:13px}
.calc-levers{display:grid;gap:8px}
.lever{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.lever input{width:20px;height:20px;accent-color:var(--teal)}
.lever b{display:block;font-size:15px}
.lever small{display:block;color:var(--muted);font-size:13.5px;line-height:1.35}
.lever em{font-style:normal;font-family:var(--mono);font-size:14px;color:var(--rust);white-space:nowrap}
.lever:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
@media (max-width:640px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .bar-row{grid-template-columns:1fr 84px;gap:4px 10px}
  .bar-name{grid-column:1/-1}
  .lever{grid-template-columns:22px 1fr}
  .lever em{grid-column:2}
}
@media (max-width:640px){ .hide-sm-t{display:none} .nav-tools{gap:6px} .brand b{font-size:14px} }

</style>

    set(k, v){ try { localStorage.setItem('cybersoho-budget:' + k, JSON.stringify(v)); } catch(e){} }
  };
  const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1600); };
  const lessons = $$('.lesson');

  /* ---- fold / unfold ---- */
  function setFold(sec, folded, keepPlace){
    const body = sec.querySelector('.lesson-body'), btn = sec.querySelector('.fold-btn');
    const headTop = sec.querySelector('.lesson-head').getBoundingClientRect().top;
    body.hidden = folded;
    sec.classList.toggle('folded', folded);
    btn.setAttribute('aria-expanded', String(!folded));
    btn.querySelector('.fold-label').textContent = folded ? 'Unfold' : 'Fold';
    btn.title = folded ? 'Unfold this lesson' : 'Fold this lesson';
    if (keepPlace && folded) {
      // folding from deep inside a lesson: bring its header back into view
      const nav = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--navh')) || 64;
      const top = sec.getBoundingClientRect().top;
      if (top < nav || headTop <= nav + 2) window.scrollTo({ top: window.scrollY + top - nav - 12, behavior: 'smooth' });
    }
    const st = store.get('folded', {}); st[sec.id] = folded; store.set('folded', st);
  }
  const savedFold = store.get('folded', {});
  lessons.forEach(sec => {
    if (savedFold[sec.id]) setFold(sec, true);
    sec.querySelector('.fold-btn').addEventListener('click', () => setFold(sec, !sec.classList.contains('folded'), true));
  });
  const all = folded => { lessons.forEach(s => setFold(s, folded)); toast(folded ? 'All lessons folded' : 'All lessons unfolded'); };
  $('#unfoldAll').onclick = () => all(false);
  $('#foldAll').onclick = () => all(true);

  /* ---- done state & progress ---- */
  let done = store.get('done', {});
  function paintDone(){
    let n = 0;
    lessons.forEach(sec => {
      const d = !!done[sec.id]; if (d) n++;
      sec.classList.toggle('is-done', d);
      const b = sec.querySelector('.done-btn'); b.setAttribute('aria-pressed', String(d));
      b.querySelector('.done-label').textContent = d ? 'Done' : 'Mark done';
      const link = document.querySelector('.side a[data-target="' + sec.id + '"]'); if (link) link.classList.toggle('is-done', d);
    });
    $('#doneCount').textContent = n;
  }
  lessons.forEach(sec => sec.querySelector('.done-btn').addEventListener('click', () => {
    done[sec.id] = !done[sec.id]; store.set('done', done); paintDone();
    if (done[sec.id]) toast('Lesson marked done');
  }));
  paintDone();

  /* ---- checklist ---- */
  const checks = store.get('checks', {});
  $$('.checklist input').forEach(cb => {
    cb.checked = !!checks[cb.dataset.key];
    cb.addEventListener('change', () => { checks[cb.dataset.key] = cb.checked; store.set('checks', checks); paintChecks(); });
  });
  function paintChecks(){
    const list = $('.checklist'); if (!list) return;
    let meta = list.nextElementSibling;
    if (!meta || !meta.classList.contains('check-meta')) { meta = document.createElement('p'); meta.className = 'check-meta'; list.after(meta); }
    const boxes = list.querySelectorAll('input'), c = Array.from(boxes).filter(b => b.checked).length;
    meta.textContent = c + ' of ' + boxes.length + ' ready' + (c === boxes.length ? ' · doors can open' : '');
  }
  paintChecks();

  /* ---- sidebar: reset & bulk ---- */
  $$('.side-tools .chip').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.act === 'unfold') all(false);
    else if (b.dataset.act === 'fold') all(true);
    else { done = {}; store.set('done', done); paintDone(); $$('.checklist input').forEach(c => { c.checked = false; checks[c.dataset.key] = false; }); store.set('checks', checks); paintChecks(); toast('Progress reset'); }
  }));

  /* ---- mobile drawer ---- */
  const menuBtn = $('#menuBtn');
  const closeDrawer = () => { document.body.classList.remove('drawer-open'); menuBtn.setAttribute('aria-expanded', 'false'); };
  menuBtn.onclick = () => { const o = document.body.classList.toggle('drawer-open'); menuBtn.setAttribute('aria-expanded', String(o)); };
  $('#backdrop').onclick = closeDrawer;
  $$('.side a').forEach(a => a.addEventListener('click', () => {
    const sec = document.getElementById(a.dataset.target); if (sec && sec.classList.contains('folded')) setFold(sec, false);
    closeDrawer();
  }));

  /* ---- scroll spy, reading bar, stuck headers ---- */
  const links = new Map($$('.side a').map(a => [a.dataset.target, a]));
  const modLinks = $$('.nav-mod');
  function onScroll(){
    const h = document.documentElement, max = h.scrollHeight - h.clientHeight;
    $('#readBar').style.width = (max > 0 ? h.scrollTop / max * 100 : 0) + '%';
    const nav = parseFloat(getComputedStyle(h).getPropertyValue('--navh')) || 64, probe = nav + 80;
    let cur = null;
    lessons.forEach(sec => {
      const r = sec.getBoundingClientRect();
      if (r.top <= probe && r.bottom > probe) cur = sec.id;
      sec.classList.toggle('stuck', r.top < nav && r.bottom > nav + 70 && !sec.classList.contains('folded'));
    });
    links.forEach((a, id) => a.classList.toggle('current', id === cur));
    let curMod = null;
    $$('.module').forEach(m => { const r = m.getBoundingClientRect(); if (r.top <= probe && r.bottom > probe) curMod = m.id; });
    modLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + curMod));
  }
  let ticking = false;
  window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { onScroll(); ticking = false; }); } }, { passive: true });
  window.addEventListener('resize', onScroll);
  onScroll();

  /* ---- lightbox ---- */
  const lb = $('#lightbox');
  $$('.zoom').forEach(z => z.addEventListener('click', () => {
    const img = z.querySelector('img'); $('#lbImg').src = img.src; $('#lbImg').alt = img.alt;
    $('#lbCap').textContent = z.parentElement.querySelector('figcaption').textContent;
    lb.classList.add('open'); $('#lbClose').focus();
  }));
  const closeLb = () => lb.classList.remove('open');
  $('#lbClose').onclick = closeLb; lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeLb(); closeDrawer(); } });

  /* ---- copy hashtags ---- */
  $$('.copy').forEach(b => b.addEventListener('click', () => {
    const t = document.getElementById(b.dataset.copy).textContent;
    const ok = () => toast('Hashtags copied');
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(ok, () => fallback(t)); else fallback(t);
    function fallback(s){ const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch(e){} ta.remove(); }
  }));

  if (document.getElementById('tStart')) {
  /* ---- rehearsal timer ---- */
  const beats = $$('.beat');
  const sec = s => { const [m, x] = s.split(':'); return +m * 60 + +x; };
  const segs = beats.map(b => ({ el: b, from: sec(b.dataset.from), to: sec(b.dataset.to), name: b.querySelector('.beat-name').textContent, time: b.querySelector('.beat-time').textContent }));
  const TOTAL = 300, bar = $('#bar');
  segs.forEach(s => { const i = document.createElement('i'); i.style.width = ((s.to - s.from) / TOTAL * 100) + '%'; i.title = s.time + ' ' + s.name; bar.insertBefore(i, $('#head')); });
  let t = 0, running = false, last = 0, raf = null, lastSeg = -1;
  const fmt = x => Math.floor(x / 60) + ':' + String(Math.floor(x % 60)).padStart(2, '0');
  function paint(){
    $('#clock').textContent = fmt(t);
    $('#head').style.left = 'calc(' + Math.min(t / TOTAL * 100, 100) + '% - 2px)';
    const idx = segs.findIndex(s => t >= s.from && t < s.to);
    segs.forEach((s, i) => s.el.classList.toggle('live', i === idx && (running || t > 0)));
    if (t >= TOTAL) { $('#now').innerHTML = '<b>Time.</b>Five minutes, right on the ask.'; }
    else if (idx >= 0 && (running || t > 0)) { const s = segs[idx]; $('#now').innerHTML = '<b>' + s.time + ' · ' + s.name + '</b>' + fmt(s.to - t) + ' left in this beat'; }
    if (running && idx !== lastSeg && idx >= 0) {
      lastSeg = idx;
      const script = segs[idx].el.closest('.lesson');
      if (script && !script.classList.contains('folded') && store.get('follow', true)) segs[idx].el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }
  function loop(now){ if (!running) return; t += (now - last) / 1000; last = now; if (t >= TOTAL) { t = TOTAL; running = false; $('#tStart').textContent = 'Start'; } paint(); raf = requestAnimationFrame(loop); }
  $('#tStart').onclick = () => {
    running = !running; $('#tStart').textContent = running ? 'Pause' : 'Resume';
    if (running) { if (t >= TOTAL) t = 0; const s = segs[0].el.closest('.lesson'); if (s.classList.contains('folded')) setFold(s, false); last = performance.now(); raf = requestAnimationFrame(loop); }
  };
  $('#tReset').onclick = () => { running = false; t = 0; lastSeg = -1; $('#tStart').textContent = 'Start'; $('#now').innerHTML = '<b>Ready when you are</b>Press start, the current beat lights up in the Script lesson.'; paint(); segs.forEach(s => s.el.classList.remove('live')); };
  $('#tGo').onclick = () => { const s = segs[0].el.closest('.lesson'); if (s.classList.contains('folded')) setFold(s, false); s.scrollIntoView({ behavior: 'smooth' }); };

  paint();
  }

}
(function(){
  const gate = document.getElementById('gate'), form = document.getElementById('gateForm');
  const pw = document.getElementById('pw'), msg = document.getElementById('gateMsg'), go = document.getElementById('go');
  const P = JSON.parse(document.getElementById('payload').textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  setTimeout(() => pw.focus(), 50);
  document.getElementById('eye').addEventListener('click', e => {
    const show = pw.type === 'password'; pw.type = show ? 'text' : 'password';
    e.currentTarget.textContent = show ? 'Hide' : 'Show'; e.currentTarget.setAttribute('aria-pressed', String(show)); pw.focus();
  });
  async function decrypt(pass){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.s), iterations: P.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const out = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, key, b64(P.c));
    return new TextDecoder().decode(out);
  }
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!window.crypto || !crypto.subtle) { msg.textContent = 'This browser cannot decrypt the page. Open the file in a current Chrome, Edge, Firefox or Safari.'; return; }
    go.disabled = true; go.textContent = 'Unlocking…'; msg.textContent = '';
    try {
      const markup = await decrypt(pw.value);
      document.getElementById('app').innerHTML = markup;
      document.body.classList.remove('locked'); pw.value = '';
      initApp(); initBudget(); window.scrollTo(0, 0);
    } catch (err) {
      msg.textContent = 'Wrong password. Check capitals, spaces and symbols.';
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake'); pw.select();
    } finally { go.disabled = false; go.textContent = 'Unlock module'; }
  });

  function initBudget(){
    const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
    const eur = v => '€' + v.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    // tooltips on bars
    const tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip);
    const show = (el, x, y) => { tip.textContent = el.dataset.tip; tip.classList.add('on');
      const r = tip.getBoundingClientRect(); tip.style.left = Math.min(x + 14, innerWidth - r.width - 8) + 'px'; tip.style.top = Math.max(y - r.height - 12, 8) + 'px'; };
    $$('.bar-row').forEach(el => {
      el.addEventListener('mousemove', e => show(el, e.clientX, e.clientY));
      el.addEventListener('mouseleave', () => tip.classList.remove('on'));
      el.addEventListener('focus', () => { const r = el.getBoundingClientRect(); show(el, r.left + r.width / 2, r.top); });
      el.addEventListener('blur', () => tip.classList.remove('on'));
      el.addEventListener('click', () => { const r = el.getBoundingClientRect(); show(el, r.left + r.width / 2, r.top); });
    });
    window.addEventListener('scroll', () => tip.classList.remove('on'), { passive: true });
    // lever calculator
    const BASE = 10721.50, levers = $$('#calc input');
    const calc = () => {
      const saved = levers.filter(l => l.checked).reduce((a, l) => a + parseFloat(l.dataset.save), 0);
      $('#calcTotal').textContent = eur(Math.round((BASE - saved) * 100) / 100);
      $('#calcSaved').textContent = saved ? 'Saves ' + eur(Math.round(saved * 100) / 100) + ' on ' + eur(BASE) : 'Full request';
    };
    levers.forEach(l => l.addEventListener('change', calc)); calc();
    // nav extras
    $('#toTop').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
    $('#lockBtn').onclick = () => { document.getElementById('app').innerHTML = ''; tip.remove(); document.body.classList.add('locked'); pw.focus(); };
  }
})();

</script>
